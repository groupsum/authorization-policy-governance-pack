[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "authorization-policy-governance-pack"
version = "0.2.0.dev1"
description = "Deprecated historical compatibility package; use the specialist governance packages."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
dependencies = [
  "ssot-pack-contracts>=0.2.17,<0.3.0",
  "tomli>=2.0.1; python_version < '3.11'",
]
keywords = [
  "ssot",
  "ssot-registry",
  "ssot-pack-contracts",
  "governance-pack",
  "governance",
  "adr",
  "spec",
  "architecture-decision-records",
  "conformance",
  "compliance",
  "authorization",
  "authorization-policy",
  "oauth",
  "oidc",
  "claims",
  "scopes",
  "access-tokens",
  "permissions",
  "entitlements",
  "rbac",
  "abac",
  "pbac",
  "rebac",
  "pdp",
  "pep",
  "opa",
  "rego",
  "cedar",
  "xacml",
]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
  "Topic :: Security",
  "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/groupsum/authorization-policy-governance-pack"
Repository = "https://github.com/groupsum/authorization-policy-governance-pack"
Issues = "https://github.com/groupsum/authorization-policy-governance-pack/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"authorization_policy_governance_pack" = ["metadata.json"]
"authorization_policy_governance_pack.templates.adr" = ["*.json", "*.yaml"]
"authorization_policy_governance_pack.templates.specs" = ["*.json", "*.yaml"]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.readme_standards]
policy = "package-guide-v1"
brand = "groupsum"
brand_catalog = "docs/readme-brands.toml"
repository = "https://github.com/groupsum/authorization-policy-governance-pack"
ref = "master"
package_path = "."
layer = "governance"
lifecycle = "deprecated"
license_file = "LICENSE"

[tool.readme_standards.distributions.pypi]
name = "authorization-policy-governance-pack"
published = false

[tool.readme_standards.examples.quick_start]
source = "examples/quick_start.py"
expected_stdout = "examples/quick_start.stdout"
test = ".github/workflows/readme-standards.yml"

[tool.readme_standards.examples.usage]
source = "examples/usage.py"
expected_exit_code = 0
test = ".github/workflows/readme-standards.yml"

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/groupsum/authorization-policy-governance-pack/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "package and example checks"
url = "https://github.com/groupsum/authorization-policy-governance-pack/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/groupsum/authorization-policy-governance-pack/blob/master/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "pack governance"
url = "https://github.com/groupsum/authorization-policy-governance-pack/blob/master/MIGRATION.md"

[tool.readme_standards.statuses.evidence]
label = "README and wheel checks"
url = "https://github.com/groupsum/authorization-policy-governance-pack/actions/workflows/readme-standards.yml"
