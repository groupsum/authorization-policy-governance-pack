  "title": "Authentication Facts Are Policy Inputs Not Authorization Decisions",
  "status": "accepted",
  "origin": "extension-pack",
  "summary": "Authentication events, identity claims, and token claims can feed policy but do not decide resource access by themselves.",
  "body": "Repositories must treat authenticated subject identity, login state, and token-derived facts as inputs to authorization policy. Application access requires an explicit permission, relationship, role, entitlement, or policy decision tied to a resource and action.",
  "decision_date": "2026-06-02",
